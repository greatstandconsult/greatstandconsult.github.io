<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Stand Educational Consult | Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <a href="index.html" class="font-extrabold text-amber-400 text-base sm:text-lg">GREAT STAND</a>
                <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider">Educational Consult Portal</span>
            </div>
            <div id="userHeaderInfo" class="hidden flex items-center gap-3">
                <span id="headerUserName" class="text-xs font-semibold text-slate-300"></span>
                <button onclick="handleLogout()" class="bg-red-500/20 text-red-300 border border-red-500/30 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-500/30 transition">Logout</button>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-grow">

        <!-- 1. LOGIN SCREEN VIEW -->
        <div id="loginView" class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl mt-10">
            <div class="text-center mb-6">
                <h1 class="text-xl font-extrabold text-white">Portal Sign In</h1>
                <p class="text-xs text-slate-400 mt-1">Access your study dashboard, CBT tests, and notes.</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-lg text-xs transition">Login to Portal</button>
                <p id="loginError" class="text-red-400 text-xs text-center mt-2 font-semibold"></p>
            </form>
        </div>

        <!-- 2. MAIN DASHBOARD VIEW (Dynamic based on role) -->
        <div id="dashboardView" class="hidden space-y-6">
            
            <!-- Welcome Banner -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h2 id="dashWelcome" class="text-lg font-bold text-white">Welcome</h2>
                    <p class="text-xs text-slate-400" id="dashRoleDesc">Loading permissions...</p>
                </div>
                <span id="roleBadge" class="text-[10px] font-bold px-3 py-1 rounded-full uppercase">Role</span>
            </div>

            <!-- TAB NAVIGATION -->
            <div id="portalTabs" class="flex overflow-x-auto gap-2 pb-2 border-b border-slate-800">
                <!-- Tabs will be dynamically populated via JavaScript depending on user role -->
            </div>

            <!-- TAB PANELS -->
            <div id="tabContentArea">
                <!-- Dynamic content container -->
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>&copy; 2026 Great Stand Educational Consult. All rights reserved.</p>
    </footer>

    <!-- Firebase SDK & Core Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;

        // AUTH STATE LISTENER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "users", user.uid));
                currentUserData = docSnap.exists() ? docSnap.data() : { role: 'student', fullName: user.email };
                
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('userHeaderInfo').classList.remove('hidden');
                document.getElementById('headerUserName').innerText = currentUserData.fullName;
                
                setupDashboardByRole();
            } else {
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('userHeaderInfo').classList.add('hidden');
            }
        });

        // LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                document.getElementById('loginError').innerText = err.message;
            }
        });

        window.handleLogout = function() {
            signOut(auth);
        };

        // SETUP ROLE-BASED TABS & DASHBOARD
        function setupDashboardByRole() {
            const role = currentUserData.role || 'student';
            const badge = document.getElementById('roleBadge');
            const desc = document.getElementById('dashRoleDesc');
            
            document.getElementById('dashWelcome').innerText = `Welcome back, ${currentUserData.fullName}!`;
            badge.innerText = role.replace('_', ' ').toUpperCase();
            
            if(role === 'super_admin') {
                badge.className = "text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1 rounded-full uppercase";
                desc.innerText = "Master Control Center — Unrestricted System Administration";
                renderTabs(['Announcements', 'Notes Library', 'CBT Manager', 'User Accounts', 'Results']);
            } else if(role === 'admin' || role === 'tutor') {
                badge.className = "text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full uppercase";
                desc.innerText = "Tutor & Admin Portal — Manage study content and review student performance";
                renderTabs(['Announcements', 'Notes Library', 'CBT Manager', 'Results']);
            } else {
                badge.className = "text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full uppercase";
                desc.innerText = "Student Portal — Access your lessons, practice CBTs, and view updates";
                renderTabs(['Announcements', 'Study Notes', 'CBT Exams', 'My Results']);
            }
        }

        // RENDER TABS DYNAMICALLY
        function renderTabs(tabNames) {
            const tabsContainer = document.getElementById('portalTabs');
            let html = '';
            tabNames.forEach((name, index) => {
                const id = name.toLowerCase().replace(/ /g, '-');
                const activeClass = index === 0 ? 'bg-amber-500 text-slate-950 font-extrabold' : 'bg-slate-900 text-slate-300 border border-slate-800 font-bold';
                html += `<button onclick="switchTab('${id}')" id="tab-${id}" class="tab-btn ${activeClass} text-xs px-4 py-2.5 rounded-lg whitespace-nowrap transition">${name}</button>`;
            });
            tabsContainer.innerHTML = html;
            loadTabContent(tabNames[0].toLowerCase().replace(/ /g, '-'));
        }

        // TAB SWITCHING LOGIC
        window.switchTab = function(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn bg-slate-900 text-slate-300 border border-slate-800 font-bold text-xs px-4 py-2.5 rounded-lg whitespace-nowrap transition";
            });
            document.getElementById(`tab-${id}`).className = "tab-btn bg-amber-500 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-lg whitespace-nowrap transition";
            loadTabContent(id);
        };

        function loadTabContent(id) {
            const area = document.getElementById('tabContentArea');
            if (id === 'announcements') {
                area.innerHTML = `
                    <div class="space-y-4">
                        ${currentUserData.role !== 'student' ? `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <h3 class="text-xs font-bold text-white mb-3">Post New Announcement</h3>
                            <form id="newAnnForm" class="space-y-3">
                                <input type="text" id="annTitle" placeholder="Title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white">
                                <textarea id="annText" placeholder="Content..." rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white"></textarea>
                                <button type="submit" class="bg-amber-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg">Publish Announcement</button>
                            </form>
                        </div>` : ''}
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <h3 class="text-xs font-bold text-white mb-3">Recent Announcements</h3>
                            <div id="annList" class="space-y-2 text-xs text-slate-400">Loading announcements...</div>
                        </div>
                    </div>
                `;
                fetchAnnouncements();
                if(document.getElementById('newAnnForm')) {
                    document.getElementById('newAnnForm').addEventListener('submit', postAnnouncement);
                }
            } else if (id.includes('notes') || id.includes('study-notes')) {
                area.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                        <h3 class="text-xs font-bold text-white mb-3">Study Library & Resources</h3>
                        <div id="notesList" class="space-y-2 text-xs text-slate-400">Loading materials...</div>
                    </div>
                `;
                fetchNotes();
            } else {
                area.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-xs text-slate-400">Module under active configuration. Check back shortly!</div>`;
            }
        }

        // FETCH ANNOUNCEMENTS
        async function fetchAnnouncements() {
            const list = document.getElementById('annList');
            const snap = await getDocs(collection(db, "announcements"));
            if(snap.empty) {
                list.innerHTML = "No announcements available.";
                return;
            }
            let html = '';
            snap.forEach(docSnap => {
                const d = docSnap.data();
                html += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><h4 class="font-bold text-white">${d.title}</h4><p class="mt-1">${d.content}</p></div>`;
            });
            list.innerHTML = html;
        }

        async function postAnnouncement(e) {
            e.preventDefault();
            await addDoc(collection(db, "announcements"), {
                title: document.getElementById('annTitle').value,
                content: document.getElementById('annText').value,
                createdAt: serverTimestamp()
            });
            document.getElementById('newAnnForm').reset();
            fetchAnnouncements();
        }

        // FETCH NOTES
        async function fetchNotes() {
            const list = document.getElementById('notesList');
            const snap = await getDocs(collection(db, "lessons"));
            if(snap.empty) {
                list.innerHTML = "No study notes uploaded yet.";
                return;
            }
            let html = '';
            snap.forEach(docSnap => {
                const d = docSnap.data();
                html += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center"><div><span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded font-bold">${d.subject}</span><h4 class="font-bold text-white mt-1">${d.title}</h4></div>${d.pdfUrl ? `<a href="${d.pdfUrl}" target="_blank" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">Download PDF</a>` : ''}</div>`;
            });
            list.innerHTML = html;
        }
    </script>
</body>
</html>
