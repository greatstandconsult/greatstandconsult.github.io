<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Stand Educational Consult | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button id="menuBtn" onclick="toggleDrawer()" class="hidden text-slate-300 hover:text-white p-1 focus:outline-none text-xl">
                ☰
            </button>
            <div>
                <span class="font-black text-xs tracking-wider text-white block">GREAT STAND</span>
                <span class="text-[9px] text-amber-400 font-bold uppercase tracking-wider">Educational Consult</span>
            </div>
        </div>
        <div id="headerAuthArea"></div>
    </header>

    <!-- SLIDE-OUT MENU DRAWER -->
    <div id="navDrawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex">
        <div class="bg-slate-900 w-80 h-full border-r border-slate-800 p-5 flex flex-col justify-between shadow-2xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
                    <div>
                        <span class="text-[10px] font-black text-amber-400 uppercase tracking-wider block">Master Control</span>
                        <span class="text-xs font-extrabold text-white">Navigation Menu</span>
                    </div>
                    <button onclick="toggleDrawer()" class="text-slate-400 hover:text-white font-bold text-xs bg-slate-800 px-2.5 py-1 rounded-lg">✕ Close</button>
                </div>
                <div id="drawerLinks" class="space-y-1.5 text-xs"></div>
            </div>
            <div class="pt-4 border-t border-slate-800 mt-4">
                <button onclick="handleLogout(); toggleDrawer();" class="w-full bg-red-500/20 text-red-300 border border-red-500/30 font-bold text-xs py-2.5 rounded-xl transition">
                    🚪 Logout
                </button>
            </div>
        </div>
        <div class="flex-grow" onclick="toggleDrawer()"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto w-full px-4 py-6 flex-grow">

        <!-- LOGIN VIEW -->
        <div id="loginView" class="view-section active mt-10">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <div class="text-center mb-6">
                    <h1 class="text-xl font-extrabold text-amber-400">Portal Login</h1>
                    <p class="text-xs text-slate-400 mt-1">Enter your credentials to access your dashboard.</p>
                </div>
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Email Address</label>
                        <input type="email" id="loginEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Password</label>
                        <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div id="loginError" class="text-red-400 text-xs hidden bg-red-500/10 p-2 rounded-lg border border-red-500/20"></div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs py-3 rounded-xl transition">
                        Sign In to Portal
                    </button>
                </form>
            </div>
        </div>

        <!-- SUPER ADMIN VIEW -->
        <div id="superAdminView" class="view-section space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex justify-between items-center">
                <div>
                    <span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Super Admin</span>
                    <h2 id="superAdminName" class="text-sm font-extrabold text-white mt-1">Welcome, Boss</h2>
                </div>
                <span class="text-[10px] text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-xl font-bold">Live System</span>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <h3 id="moduleTitle" class="text-xs font-black uppercase text-amber-400">🏠 Dashboard Overview</h3>
                    <span id="moduleBadge" class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded font-bold">Active</span>
                </div>
                <div id="moduleContentArea" class="space-y-4"></div>
            </div>
        </div>

        <!-- STANDARD USER VIEW -->
        <div id="standardView" class="view-section space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <span id="standardRoleBadge" class="bg-blue-500/20 text-blue-400 border border-blue-500/30 text-[9px] font-black px-2 py-0.5 rounded uppercase">Member Portal</span>
                <h2 id="standardUserName" class="text-base font-extrabold text-white mt-1">Welcome</h2>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg" id="standardContentArea">
                <h3 class="text-xs font-black uppercase text-amber-400 mb-2">Workspace</h3>
            </div>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-[10px] text-slate-500">
        &copy; 2026 Great Stand Educational Consult. All rights reserved.
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHnSGUALrnN-j8inER4MNcveQwJmyhLP4",
            authDomain: "great-stand-portal.firebaseapp.com",
            databaseURL: "https://great-stand-portal-default-rtdb.firebaseio.com",
            projectId: "great-stand-portal",
            storageBucket: "great-stand-portal.firebasestorage.app",
            messagingSenderId: "747296287485",
            appId: "1:747296287485:web:3289d724c48c197141ac94",
            measurementId: "G-JE18QY2Z2K"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function toggleDrawer() { document.getElementById('navDrawer').classList.toggle('hidden'); }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            const menuBtn = document.getElementById('menuBtn');
            const authArea = document.getElementById('headerAuthArea');
            if(viewId === 'loginView') {
                menuBtn.classList.add('hidden');
                authArea.innerHTML = '';
            } else {
                menuBtn.classList.remove('hidden');
                authArea.innerHTML = `<button onclick="handleLogout()" class="bg-slate-800 text-red-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">Logout</button>`;
            }
        }

        function populateMenu(role) {
            const linksContainer = document.getElementById('drawerLinks');
            if (role === 'super_admin') {
                linksContainer.innerHTML = `
                    <a href="#" onclick="loadModule('dashboard')" class="block p-2 rounded-xl bg-slate-800 text-amber-400 font-bold">🏠 Dashboard Overview</a>
                    <div class="text-[10px] text-slate-500 uppercase px-2 pt-2 font-black">User Management</div>
                    <a href="#" onclick="loadModule('students')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">👥 Students Management</a>
                    <a href="#" onclick="loadModule('admins')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">👑 Admins Management</a>
                    <a href="#" onclick="loadModule('tutors')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">🧑🏽‍🏫 Tutors Management</a>
                    <div class="text-[10px] text-slate-500 uppercase px-2 pt-2 font-black">Academics & CBT</div>
                    <a href="#" onclick="loadModule('questions')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">❓ Master Question Bank</a>
                    <a href="#" onclick="loadModule('cbts')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">🧪 CBT Management</a>
                    <a href="#" onclick="loadModule('timetable')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">📅 Timetable & Zoom</a>
                    <a href="#" onclick="loadModule('notes')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">📚 Notes & Resources</a>
                    <a href="#" onclick="loadModule('audit')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">📝 Audit Logs</a>
                `;
            } else {
                linksContainer.innerHTML = `
                    <a href="#" onclick="loadModule('dashboard')" class="block p-2 rounded-xl bg-slate-800 text-amber-400 font-bold">🏠 Dashboard</a>
                    <a href="#" onclick="loadModule('timetable')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">📅 Class Timetable</a>
                    <a href="#" onclick="loadModule('notes')" class="block p-2 rounded-xl hover:bg-slate-800 text-slate-300">📚 Notes & Resources</a>
                `;
            }
        }

        function loadModule(key) {
            toggleDrawer();
            let titleEl = document.getElementById('moduleTitle');
            let contentEl = document.getElementById('moduleContentArea');

            if (key === 'dashboard') {
                titleEl.innerText = "🏠 Dashboard Overview";
                contentEl.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                            <span class="text-[10px] text-slate-400 uppercase font-bold block">Total Users</span>
                            <span id="statUsers" class="text-xl font-black text-amber-400">Loading...</span>
                        </div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                            <span class="text-[10px] text-slate-400 uppercase font-bold block">System Status</span>
                            <span class="text-xs font-black text-emerald-400 mt-1 block">Online</span>
                        </div>
                    </div>
                `;
                db.collection('users').get().then(snap => {
                    document.getElementById('statUsers').innerText = snap.size;
                });
            } 
            else if (key === 'students' || key === 'admins' || key === 'tutors') {
                let roleType = key === 'students' ? 'student' : (key === 'admins' ? 'admin' : 'tutor');
                titleEl.innerText = `👥 Manage ${key.toUpperCase()}`;
                contentEl.innerHTML = `
                    <form onsubmit="handleCreateUser(event, '${roleType}')" class="space-y-3 border-b border-slate-800 pb-4">
                        <p class="text-[11px] text-slate-400 font-bold">Register New ${roleType}</p>
                        <input type="text" id="regName" required placeholder="Full Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="email" id="regEmail" required placeholder="Email Address" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="text" id="regPass" required placeholder="Temporary Password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button type="submit" class="w-full bg-amber-500 text-slate-950 font-extrabold text-xs py-2 rounded-xl">Create Account</button>
                    </form>
                    <div class="space-y-2">
                        <p class="text-[11px] text-slate-400 font-bold">Registered List:</p>
                        <div id="userListContainer" class="space-y-2 max-h-48 overflow-y-auto text-xs">Loading list...</div>
                    </div>
                `;
                db.collection('users').where('role', '==', roleType).get().then(snap => {
                    let listHtml = '';
                    snap.forEach(doc => {
                        let u = doc.data();
                        listHtml += `<div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                            <div><span class="font-bold text-white block">${u.name}</span><span class="text-[10px] text-slate-500">${u.email}</span></div>
                            <span class="text-[9px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded font-bold">${u.role}</span>
                        </div>`;
                    });
                    document.getElementById('userListContainer').innerHTML = listHtml || '<p class="text-slate-500 text-xs">No records found.</p>';
                });
            }
            else if (key === 'questions') {
                titleEl.innerText = "❓ Master Question Bank";
                contentEl.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-xs text-slate-400">Add questions into the database.</p>
                        <textarea id="qText" placeholder="Type question here..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white h-20"></textarea>
                        <input type="text" id="qSubject" placeholder="Subject (e.g., Mathematics)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="saveQuestionItem()" class="w-full bg-amber-500 text-slate-950 font-bold text-xs py-2 rounded-xl">Save Question</button>
                    </div>
                `;
            }
            else if (key === 'cbts') {
                titleEl.innerText = "🧪 CBT Test Management";
                contentEl.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-xs text-slate-400">Configure online CBT exams and durations.</p>
                        <input type="text" id="cbtTitle" placeholder="Test Title (e.g., Mock JAMB)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="number" id="cbtDuration" placeholder="Duration in Minutes" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="saveCbtItem()" class="w-full bg-amber-500 text-slate-950 font-bold text-xs py-2 rounded-xl">Publish CBT Test</button>
                    </div>
                `;
            }
            else if (key === 'timetable') {
                titleEl.innerText = "📅 Timetable & Zoom Classes";
                contentEl.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-xs text-slate-400">Post live class schedules and Zoom links.</p>
                        <input type="text" id="classTitle" placeholder="Subject Title (e.g., Physics Revision)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="text" id="zoomLink" placeholder="Zoom Meeting URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="saveTimetableItem()" class="w-full bg-amber-500 text-slate-950 font-bold text-xs py-2 rounded-xl">Publish Class Schedule</button>
                    </div>
                `;
            }
            else if (key === 'notes') {
                titleEl.innerText = "📚 Notes & Resources";
                contentEl.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-xs text-slate-400">Upload study materials and resource links.</p>
                        <input type="text" id="noteTitle" placeholder="Document Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="text" id="noteUrl" placeholder="Download / File Link URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="saveNoteItem()" class="w-full bg-amber-500 text-slate-950 font-bold text-xs py-2 rounded-xl">Upload Resource</button>
                    </div>
                `;
            }
            else if (key === 'audit') {
                titleEl.innerText = "📝 System Audit Logs";
                contentEl.innerHTML = `
                    <div class="space-y-2">
                        <p class="text-xs text-slate-400">Administrative actions and security records.</p>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                            <span class="text-amber-400 font-bold block">[System Log]</span> Database connection active and secure.
                        </div>
                    </div>
                `;
            }
        }

        function saveQuestionItem() {
            let text = document.getElementById('qText').value;
            let subject = document.getElementById('qSubject').value;
            if(!text || !subject) { alert('Please fill all fields'); return; }
            db.collection('questions').add({ text, subject, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => { alert('Question successfully saved to database!'); document.getElementById('qText').value = ''; document.getElementById('qSubject').value = ''; })
              .catch(err => alert('Error: ' + err.message));
        }

        function saveCbtItem() {
            let title = document.getElementById('cbtTitle').value;
            let duration = document.getElementById('cbtDuration').value;
            if(!title || !duration) { alert('Please fill all fields'); return; }
            db.collection('cbts').add({ title, duration, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => { alert('CBT test successfully published!'); document.getElementById('cbtTitle').value = ''; document.getElementById('cbtDuration').value = ''; })
              .catch(err => alert('Error: ' + err.message));
        }

        function saveTimetableItem() {
            let title = document.getElementById('classTitle').value;
            let link = document.getElementById('zoomLink').value;
            if(!title || !link) { alert('Please fill all fields'); return; }
            db.collection('timetable').add({ title, link, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => { alert('Class schedule published successfully!'); document.getElementById('classTitle').value = ''; document.getElementById('zoomLink').value = ''; })
              .catch(err => alert('Error: ' + err.message));
        }

        function saveNoteItem() {
            let title = document.getElementById('noteTitle').value;
            let url = document.getElementById('noteUrl').value;
            if(!title || !url) { alert('Please fill all fields'); return; }
            db.collection('notes').add({ title, url, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => { alert('Resource uploaded successfully!'); document.getElementById('noteTitle').value = ''; document.getElementById('noteUrl').value = ''; })
              .catch(err => alert('Error: ' + err.message));
        }

        function handleLogin(e) {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .then(cred => routeUser(cred.user.uid))
                .catch(err => {
                    let errBox = document.getElementById('loginError');
                    errBox.innerText = err.message;
                    errBox.classList.remove('hidden');
                });
        }

        function handleCreateUser(e, role) {
            e.preventDefault();
            let name = document.getElementById('regName').value;
            let email = document.getElementById('regEmail').value;
            let pass = document.getElementById('regPass').value;

            let secondaryApp = firebase.initializeApp(firebaseConfig, "Sec_" + Date.now());
            secondaryApp.auth().createUserWithEmailAndPassword(email, pass)
                .then(cred => {
                    return db.collection('users').doc(cred.user.uid).set({
                        name, email, role, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert(`Success! ${name} registered.`);
                    secondaryApp.delete();
                    loadModule(role === 'student' ? 'students' : (role === 'admin' ? 'admins' : 'tutors'));
                })
                .catch(err => { alert("Error: " + err.message); secondaryApp.delete(); });
        }

        function routeUser(uid) {
            db.collection('users').doc(uid).get().then(doc => {
                let userData = doc.exists ? doc.data() : { role: 'student', name: 'User' };
                let role = userData.role || 'student';
                populateMenu(role);
                if (role === 'super_admin') {
                    document.getElementById('superAdminName').innerText = `Welcome, ${userData.name || 'Boss'}`;
                    switchView('superAdminView');
                    loadModule('dashboard');
                } else {
                    document.getElementById('standardUserName').innerText = `Welcome, ${userData.name || 'Member'}`;
                    document.getElementById('standardRoleBadge').innerText = role.toUpperCase() + ' PORTAL';
                    switchView('standardView');
                    loadModule('timetable');
                }
            });
        }

        function handleLogout() { auth.signOut().then(() => switchView('loginView')); }

        auth.onAuthStateChanged(user => { user ? routeUser(user.uid) : switchView('loginView'); });
    </script>
</body>
</html>
